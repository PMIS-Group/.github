name: PMIS Security weekly organization progress

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Days of activity to include
        required: false
        default: '7'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pmis-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build weekly activity report
        env:
          GH_TOKEN: ${{ secrets.PMIS_PROJECT_TOKEN || github.token }}
          DAYS: ${{ inputs.days || '7' }}
        run: python pmis-security/organization_progress.py --org PMIS-Group --days "$DAYS" --output weekly-progress.md
      - uses: actions/upload-artifact@v4
        with:
          name: pmis-security-weekly-progress
          path: weekly-progress.md
          retention-days: 90
      - name: Update report branch
        id: report
        run: |
          set -euo pipefail
          branch="pmis-security/organization-reports"
          git config user.name "PMIS Security"
          git config user.email "pmis-security@users.noreply.github.com"
          git fetch origin "$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi
          mkdir -p security-reports
          cp "$GITHUB_WORKSPACE/weekly-progress.md" "security-reports/weekly-$(date -u +%F).md"
          cp "$GITHUB_WORKSPACE/weekly-progress.md" security-reports/weekly-latest.md
          git add security-reports
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: update PMIS Security weekly progress"
            git push --force-with-lease origin "$branch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create report pull request
        env:
          REPORT_TOKEN: ${{ secrets.PMIS_PROJECT_TOKEN }}
        if: steps.report.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let headers = {};
            if (process.env.REPORT_TOKEN) {
              const candidate = { authorization: 'Bearer ' + process.env.REPORT_TOKEN };
              try {
                await github.rest.repos.get({ owner, repo, headers: candidate });
                headers = candidate;
              } catch (error) {
                if (![401, 403].includes(error.status)) throw error;
                core.warning('PMIS_PROJECT_TOKEN is invalid or lacks access. Falling back to GITHUB_TOKEN; replace the organization secret.');
              }
            }
            const head = 'pmis-security/organization-reports';
            const open = await github.rest.pulls.list({ owner, repo, headers, head: `${owner}:${head}`, state: 'open' });
            if (!open.data.length) {
              try {
                await github.rest.pulls.create({ owner, repo, headers, head, base: context.payload.repository.default_branch, title: 'docs: PMIS Security weekly organization progress', body: 'Automated weekly organization progress report. It reports GitHub activity and links review work; it does not judge working hours or quality by itself.' });
              } catch (error) {
                if (error.status !== 403 ||
                    !String(error.message).includes('GitHub Actions is not permitted to create or approve pull requests')) {
                  throw error;
                }
                const url = 'https://github.com/' + owner + '/' + repo +
                  '/compare/' + context.payload.repository.default_branch + '...' + head + '?expand=1';
                core.warning('Report saved, but GitHub policy blocks automatic PR creation. Open the comparison link in the job summary.');
                await core.summary.addHeading('Security report saved')
                  .addRaw('Automatic PR creation is blocked by repository or organization policy.')
                  .addLink('Open the report pull request', url).write();
              }
            }

